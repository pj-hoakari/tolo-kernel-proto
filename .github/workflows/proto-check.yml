name: Check Proto

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    proto-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check generated Go code
              uses: pj-hoakari/actions/proto-check@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
              with:
                  generate-task: proto:gen:go
                  generated-path: gen/

    proto-breaking:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up mise
              uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
              with:
                  install_args: buf task

            - name: Check breaking changes
              run: task proto:breaking
