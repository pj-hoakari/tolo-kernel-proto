name: autofix.ci

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    golangci-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run golangci-lint
              uses: pj-hoakari/actions/go/lint@c61d08b3baf77fa710bcea9849e1c88540fd1248 # v20261003.0.0
